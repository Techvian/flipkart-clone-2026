<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart-Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-01">
            <div class="logo-box_01">
                <div class="logo">
                    <img src="images/d2ecfddf891a3922.webp" class="logo-img-01" alt="Flipkart Logo">
                    <img src="images/31f7e3af490c225f.webp" class="logo-img-02 text" alt="Flipkart">
                </div>
            </div>
            <div class="logo-box-02">
                <div class="travel">
                    <img src="images/plane.webp" class="plane-img" alt="plane">
                    <img src="images/travel.webp" class="travel-img" alt="travel">
                </div>
            </div>
            <div class="location">
                <div class="location-text">
                    <i class="fa-solid fa-location-dot"></i>
                    <p>Location not set</p>
                    <a>Select deleviry location ></a>
                </div>
            </div>
        </div>
        <div class="header-02">
            <div class="nav-search">
                <button class="nav-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <input class="search-input" placeholder="Search for Products, Brand and More">
            </div>
            <div class="nav-login">
                <div class="login-img">
                    <img src="images/profile-6bae67.svg">
                    Login
                </div>
            </div>
        </div>
    </header>
</body>
