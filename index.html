<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart-Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-01">
                <div class="logo-box-01">
                    <div class="logo">
                        <img src="images/d2ecfddf891a3922.webp" class="logo-img-01" alt="Flipkart Logo">
                        <img src="images/31f7e3af490c225f.webp" class="logo-img-02 text" alt="Flipkart">
                    </div>
                </div>
                <div class="logo-box-02">
                    <div class="minutes">
                        <img src="images/scooty_img.webp" class="scooty-img" alt="scooty-img">
                        <img src="images/minutes.webp" class="minutes-text-img" alt="minutes-img">
                    </div>
                </div>
                <div class="logo-box-03">
                    <div class="travel">
                        <img src="images/plane.webp" class="plane-img" alt="plane">
                        <img src="images/travel.webp" class="travel-text-img" alt="travel">
                    </div>
                </div>
                <div class="logo-box-04">
                    <div class="grocery">
                        <img src="images/grocery-img.webp" class="grocery-img" alt="grocery-img">
                        <img src="images/grocery.webp" class="grocery-text-img" alt="grocery">
                    </div>
                </div>
                <div class="location">
                    <div class="location-text">
                        <i class="fa-solid fa-location-dot"></i>
                        <p>Location not set</p>
                        <a href="#">Select delivery location</a>
                    </div>
                </div>
            </div>
            <div class="header-02">
                <div class="nav-search">
                    <button class="nav-button">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <input class="search-input" placeholder="Search for Products, Brands and More">
                </div>
                <div class="nav-function">
                    <div class="nav-login">
                        <div class="login-img">
                            <i class="fa-regular fa-circle-user"></i>
                            Login
                        </div>
                    </div>
                    <div class="more">
                        <span>More</span>
                    </div>
                    <div class="cart">
                        <div class="cart-img">
                            <i class="fa-solid fa-cart-shopping"></i>
                            Cart
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-03">
                <div class="nav-store">
                    <div class="box-01 box">
                        <div class="box-content">
                            <i class="fa-solid fa-bag-shopping"></i>
                            <p class="text-02">For You</p>
                        </div>
                    </div>
                    <div class="box-02 box">
                        <div class="box-content">
                            <i class="fa-solid fa-shirt"></i>
                            <p class="text-03">Fashion</p>
                        </div>
                    </div>
                    <div class="box-03 box">
                        <div class="box-content">
                            <i class="fa-solid fa-mobile-screen"></i>
                            <p class="text-04">Mobiles</p>
                        </div>
                    </div>
                    <div class="box-04 box">
                        <div class="box-content">
                            <i class="fa-solid fa-laptop"></i>
                            <p class="text-05">Electronics</p>
                        </div>
                    </div>
                    <div class="box-05 box">
                        <div class="box-content">
                            <img src="images/lipstick.png" class="lipstick-img" alt="lipstick">
                            <p class="text-06">Beauty</p>
                        </div>
                    </div>
                    <div class="box-06 box">
                        <div class="box-content">
                            <i class="fa-regular fa-lightbulb"></i>
                            <p class="text-07">Home</p>
                        </div>
                    </div>
                    <div class="box-07 box">
                        <div class="box-content">
                            <i class="fa-solid fa-tv"></i>
                            <p class="text-08">Appliances</p>
                        </div>
                    </div>
                    <div class="box-08 box">
                        <div class="box-content">
                            <i class="fa-solid fa-gamepad"></i>
                            <p class="text-09">Toys, baby..</p>
                        </div>
                    </div>
                    <div class="box-09 box">
                        <div class="box-content">
                            <i class="fa-solid fa-bottle-water"></i>
                            <p class="text-10">Food & Health</p>
                        </div>
                    </div>
                    <div class="box-10 box">
                        <div class="box-content">
                            <i class="fa-solid fa-helmet-un"></i>
                            <p class="text-11">Auto Accessories</p>
                        </div>
                    </div>
                    <div class="box-11 box">
                        <div class="box-content">
                            <i class="fa-solid fa-baseball-bat-ball"></i>
                            <p class="text-12">Sport & Fitness</p>
                        </div>
                    </div>
                    <div class="box-12 box">
                        <div class="box-content">
                            <i class="fa-solid fa-couch"></i>
                            <p class="text-13">Furniture</p>
                        </div>
                    </div>
                    <div class="box-13 box">
                        <div class="box-content">
                            <i class="fa-solid fa-book"></i>
                            <p class="text-14">Books & Media</p>
                        </div>
                    </div>
                    <div class="box-14 box">
                        <div class="box-content">
                            <i class="fa-solid fa-motorcycle"></i>
                            <p class="text-15">2 Wheelers</p>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </header>
    <main>
        <div class="header-04">
                <div class="coupon">
                    <img src="images/cupon-img.webp" class="coupon-img" alt="cupon-img">
                </div>
            </div>
        <section class="ads-section">
            <div class="ad-card">
                <img src="images/ad-img/ad-img-01.webp" alt="ad-img-01">
            </div>
            <div class="ad-card">
                <img src="images/ad-img/ad-img-02.webp" alt="ad-img-02">
            </div>
            <div class="ad-card">
                <img src="images/ad-img/ad-img-03.webp" alt="ad-img-03">
            </div>
        </section>
    </main>
</body>
</html>
